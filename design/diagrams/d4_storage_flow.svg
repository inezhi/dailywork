<text x="180" y="600" font-family="'Noto Sans SC','PingFang SC','Inter',sans-serif" font-size="11.5" font-weight="400" fill="#5B5750" text-anchor="start" opacity="1">图片与业务数据同库同事务；快照与导出都基于一致性副本；导入失败只回滚，不写半份数据。</text>
<text x="100" y="620" font-family="'Noto Sans SC','PingFang SC','Inter',sans-serif" font-size="11.5" font-weight="400" fill="#8A857D" text-anchor="start" opacity="1">体积控制：20MB/文件 · sha256 去重 · 缩略图 · 数据库超过 2GB 时提示归档或导出。</text>
