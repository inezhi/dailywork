<text x="494" y="466" font-family="'Noto Sans SC','PingFang SC','Inter',sans-serif" font-size="11" font-weight="400" fill="#6A9BCC" text-anchor="start" opacity="1">data.sqlite 是唯一数据源</text>
<text x="494" y="486" font-family="'Noto Sans SC','PingFang SC','Inter',sans-serif" font-size="10.5" font-weight="400" fill="#8A857D" text-anchor="start" opacity="1">含图片，导出不会漏文件</text>
