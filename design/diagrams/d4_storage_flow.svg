<text x="926" y="311" font-family="'Noto Sans SC','PingFang SC','Inter',sans-serif" font-size="10.5" font-weight="400" fill="#8A857D" text-anchor="start" opacity="1">data.sqlite + manifest + markdown</text>
<text x="926" y="330" font-family="'Noto Sans SC','PingFang SC','Inter',sans-serif" font-size="10" font-weight="400" fill="#8A857D" text-anchor="start" opacity="1">包含图片 BLOB · 不含 AI Key</text>
