<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Logo Options</title>
<style>
body{margin:0;background:#FAF9F5;font-family:-apple-system,BlinkMacSystemFont,"Inter","PingFang SC",sans-serif;color:#141413}
.sheet{width:1200px;height:520px;padding:44px 56px}
h1{font-size:24px;margin:0 0 6px}
p{font-size:12px;color:#8A857D;margin:0 0 34px}
.row{display:flex;gap:40px}
.opt{width:340px;background:#fff;border:1px solid #E8E6DC;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center}
.mark{width:150px;height:150px;margin:10px 0 18px}
.name{font-size:14px;font-weight:700}
.desc{font-size:11px;color:#8A857D;margin-top:6px;text-align:center;line-height:1.6}
.sw{display:flex;gap:8px;margin-top:12px;font-size:9px;color:#8A857D;align-items:center}
.sw i{width:10px;height:10px;border-radius:3px;display:inline-block}
</style></head><body><div class="sheet">
<h1>品牌标识方向 · 3 个方案</h1>
<p>更复杂的「时间/序列」结构，改用深松绿 + 沙金，与暖色界面形成冷静对比。</p>
<div class="row">
  <div class="opt">
    <svg class="mark" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="24" fill="none" stroke="#2F5D57" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="118 33" transform="rotate(-110 32 32)"/>
      <circle cx="32" cy="32" r="16" fill="none" stroke="#C9A96E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="70 31" transform="rotate(50 32 32)"/>
      <circle cx="32" cy="32" r="4.4" fill="#2F5D57"/>
      <circle cx="47" cy="17" r="3" fill="#C9A96E"/>
    </svg>
    <div class="name">A · 双层轨道</div>
    <div class="desc">外圈深松绿，内圈沙金；中心点与缺口卫星点构成时间轨道。</div>
    <div class="sw"><span><i style="background:#2F5D57"></i>#2F5D57</span><span><i style="background:#C9A96E"></i>#C9A96E</span></div>
  </div>
  <div class="opt">
    <svg class="mark" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="25" fill="none" stroke="#2F5D57" stroke-width="2.2" stroke-dasharray="150 7" transform="rotate(-90 32 32)"/>
      <g stroke="#2F5D57" stroke-width="1.4" opacity=".45">
        <line x1="32" y1="42" x2="32" y2="47"/><line x1="32" y1="17" x2="32" y2="22"/>
        <line x1="17" y1="32" x2="22" y2="32"/><line x1="42" y1="32" x2="47" y2="32"/>
        <line x1="21.4" y1="21.4" x2="24.9" y2="24.9"/><line x1="39.1" y1="39.1" x2="42.6" y2="42.6"/>
        <line x1="42.6" y1="21.4" x2="39.1" y2="24.9"/><line x1="24.9" y1="39.1" x2="21.4" y2="42.6"/>
      </g>
      <circle cx="32" cy="32" r="18" fill="none" stroke="#C9A96E" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="84 29" transform="rotate(-40 32 32)"/>
      <rect x="28" y="28" width="8" height="8" rx="1.6" fill="#2F5D57" transform="rotate(45 32 32)"/>
      <circle cx="46" cy="18" r="2.8" fill="#C9A96E"/>
    </svg>
    <div class="name">B · 时间表盘</div>
    <div class="desc">细分刻度 + 双层弧线 + 菱形核心，更像一枚时间仪器。</div>
    <div class="sw"><span><i style="background:#2F5D57"></i>#2F5D57</span><span><i style="background:#C9A96E"></i>#C9A96E</span></div>
  </div>
  <div class="opt">
    <svg class="mark" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="24" fill="none" stroke="#2F5D57" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="118 33" transform="rotate(-110 32 32)"/>
      <circle cx="32" cy="32" r="16" fill="none" stroke="#2F5D57" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="70 31" transform="rotate(50 32 32)" opacity=".35"/>
      <path d="M32 20 L38 32 L32 44 L26 32 Z" fill="#C9A96E"/>
      <circle cx="47" cy="17" r="3" fill="#2F5D57"/>
    </svg>
    <div class="name">C · 沙金核心</div>
    <div class="desc">以沙金菱形作为视觉重心，双层轨道更克制，单色也成立。</div>
    <div class="sw"><span><i style="background:#2F5D57"></i>#2F5D57</span><span><i style="background:#C9A96E"></i>#C9A96E</span></div>
  </div>
</div>
</div></body></html>
