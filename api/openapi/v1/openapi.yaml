openapi: 3.1.0
info:
  title: 时序 API
  version: 1.0.0
  description: |
    External REST contract served by the gateway. Browsers and the desktop app
    only see this layer; the gateway calls DailyWorkService over Thrift internally.

    Both success and error responses use a single envelope:
    success is { data, meta }, error is { error, meta }.
    meta.requestId is always present and equals the X-Request-Id response header.

servers:
  # 相对路径：生成的客户端跟着当前页面/网关的域名走，不写死主机
  - url: /

security:
  - sessionCookie: []
  - bearerAuth: []

paths:
  /api/v1/echo:
    post:
      operationId: echo
      summary: 连通性检查
      description: |
        Returns the message from the request body unchanged. Unlike /healthz,
        which only proves the gateway process is alive, this call reaches
        DailyWorkService.Echo and proves the whole gateway -> RPC chain works.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchoReq'
      responses:
        '200':
          description: Request succeeded; data contains the echoed message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/tasks:
    post:
      operationId: createTask
      summary: 创建任务
      description: |
        title is required. When spaceId is omitted, the task goes to the user's
        default space. When parentId is provided, spaceId and projectId are
        ignored and inherited from the parent. notes / status / priority default
        to "" / inbox / none. The user identity always comes from the session and
        is never accepted from the request body. status=done is rejected; use the
        complete endpoint instead.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskReq'
      responses:
        '200':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/codes:
    post:
      operationId: sendCode
      summary: 发送验证码
      description: |
        Sends a verification code. The development environment does not send real
        email or SMS; the code is always 2222. Provide exactly one of email or phone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeReq'
      responses:
        '200':
          description: Code "sent" (no real delivery in development)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCodeEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/register:
    post:
      operationId: register
      summary: 注册
      description: |
        Email or phone number + verification code + password. Provide exactly one
        of email or phone. The verification code is always 2222 in development.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReq'
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/login:
    post:
      operationId: login
      summary: 登录
      description: |
        Email or phone number + password. On success a JWT is issued: web clients
        receive it as an HttpOnly cookie named daily_session; desktop clients that
        send X-Client: desktop receive it as a token in the response body.
      security: []
      parameters:
        - name: X-Client
          in: header
          required: false
          description: Send desktop to receive a Bearer token; otherwise only a cookie is set
          schema:
            type: string
            enum: [desktop]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 登出
      description: Revokes the current session; the same token will no longer validate.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/today:
    get:
      operationId: listToday
      summary: 今天页
      description: |
        Returns six fixed groups ordered by priority: overdue, due today,
        planned today, doing, next, completed today. Each task appears in at
        most one group. The date is supplied by the client (YYYY-MM-DD); the
        server never derives "today" from its own timezone.
      parameters:
        - name: date
          in: query
          required: true
          description: Client local date in YYYY-MM-DD
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Today groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: daily_session
      description: Used by the web client; HttpOnly cookie
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Used by the desktop and script clients; obtain it at login with X-Client: desktop'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Recommended for all write requests. 16-128 characters, scoped per user and
        kept for 24 hours. Same user, same key, same body: the first response is
        replayed. Same key with a different body: 409.
      schema:
        type: string
        minLength: 16
        maxLength: 128

  responses:
    ValidationFailed:
      description: Missing field, malformed value, or length out of range
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Not logged in, session expired, or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Version conflict, idempotency key reuse, or unique constraint conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Target resource does not exist, e.g. parent task id not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: Unexpected error; details are only in the logs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    EchoReq:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 200

    Echo:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: Returned unchanged; the caller can verify it was not modified

    EchoEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Echo'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateTaskReq:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 20000
        spaceId:
          type: string
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/CreateTaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        scheduledDate:
          type: [string, 'null']
          format: date
        dueDate:
          type: [string, 'null']
          format: date
        estimateMinutes:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
        tagIds:
          type: array
          x-go-type-skip-optional-pointer: true
          items:
            type: string
            format: uuid

    Task:
      type: object
      additionalProperties: false
      required:
        - id
        - spaceId
        - title
        - notes
        - status
        - priority
        - actualMinutes
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        title:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 20000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        scheduledDate:
          type: [string, 'null']
          format: date
        dueDate:
          type: [string, 'null']
          format: date
        estimateMinutes:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
        actualMinutes:
          type: integer
          minimum: 0
        completedAt:
          type: [string, 'null']
          format: date-time
        tagIds:
          type: array
          x-go-type-skip-optional-pointer: true
          items:
            type: string
            format: uuid
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskStatus:
      type: string
      description: Tasks have no archived status
      enum: [inbox, next, doing, waiting, blocked, done]

    CreateTaskStatus:
      type: string
      description: |
        Statuses allowed at creation time; unlike TaskStatus, done is excluded.
        Creating a completed task would leave completedAt without a source;
        completion must go through POST /tasks/{id}/complete.
        Passing done returns 400 VALIDATION_FAILED.
      enum: [inbox, next, doing, waiting, blocked]

    TaskPriority:
      type: string
      description: Affects ordering and display only; does not affect today grouping
      enum: [none, low, medium, high, urgent]

    Meta:
      type: object
      additionalProperties: false
      description: Included in every response. requestId matches the X-Request-Id response header.
      required: [requestId]
      properties:
        requestId:
          type: string
          description: UUIDv7 generated by the gateway, used to correlate logs

    TaskEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Task'
        meta:
          $ref: '#/components/schemas/Meta'

    SendCodeReq:
      type: object
      additionalProperties: false
      description: Provide exactly one of email or phone
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'

    SendCodeData:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel:
          type: string
          enum: [email, phone]

    SendCodeEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SendCodeData'
        meta:
          $ref: '#/components/schemas/Meta'

    RegisterReq:
      type: object
      additionalProperties: false
      description: Provide exactly one of email or phone
      required: [code, password]
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'
        code:
          type: string
          minLength: 4
          maxLength: 8
        password:
          type: string
          minLength: 8
          maxLength: 72

    RegisterData:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    RegisterEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RegisterData'
        meta:
          $ref: '#/components/schemas/Meta'

    LoginReq:
      type: object
      additionalProperties: false
      description: Provide exactly one of email or phone
      required: [password]
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'
        password:
          type: string

    LoginData:
      type: object
      additionalProperties: false
      required: [userId, expiresAt]
      properties:
        token:
          type: string
          description: Returned only with X-Client desktop; web clients read the cookie instead
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time

    LoginEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/LoginData'
        meta:
          $ref: '#/components/schemas/Meta'

    OkData:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean

    OkEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/OkData'
        meta:
          $ref: '#/components/schemas/Meta'

    TodayGroupKind:
      type: string
      description: Group priority follows the enum order
      enum: [overdue, due_today, planned_today, doing, next, completed_today]

    TodayGroup:
      type: object
      additionalProperties: false
      required: [kind, tasks, count, estimateMinutes]
      properties:
        kind:
          $ref: '#/components/schemas/TodayGroupKind'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        count:
          type: integer
          minimum: 0
        estimateMinutes:
          type: integer
          minimum: 0

    TodayData:
      type: object
      additionalProperties: false
      required: [date, groups]
      properties:
        date:
          type: string
          format: date
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TodayGroup'

    TodayEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/TodayData'
        meta:
          $ref: '#/components/schemas/Meta'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: User-facing; safe to display
        details:
          type: object
          additionalProperties: true
          description: Structured extra data, e.g. currentVersion, taskId

    ErrorCode:
      type: string
      description: Stable machine-readable code; the HTTP status conveys the category, the code the specific reason
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - ALREADY_EXISTS
        - RATE_LIMITED
        - INTERNAL
        - DEPENDENCY_UNAVAILABLE

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/Meta'
