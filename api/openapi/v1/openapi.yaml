openapi: 3.1.0
info:
  title: 时序 API
  version: 1.0.0
  description: |
    对外 REST 契约，由 gateway 提供。浏览器与桌面端只看到这一层；
    gateway 内部再用 Thrift 调用 DailyWorkService，那些结构不出现在这里。

    成功与错误都走统一信封：成功是 { data, meta }，错误是 { error, meta }。
    meta.requestId 每次都有，与响应头 X-Request-Id 是同一个值。

servers:
  # 相对路径：生成的客户端跟着当前页面/网关的域名走，不写死主机
  - url: /

security:
  - sessionCookie: []
  - bearerAuth: []

paths:
  /api/v1/echo:
    post:
      operationId: echo
      summary: 连通性检查
      description: |
        把请求体里的 message 原样返回。与 /healthz 的区别：/healthz 只证明 gateway 进程活着，
        这个会一路调到 DailyWorkService.Echo，证明 gateway → RPC 服务 整条链路通。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchoReq'
      responses:
        '200':
          description: 链路通，data 里是原样回显的内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/tasks:
    post:
      operationId: createTask
      summary: 创建任务
      description: |
        title 必填。省略 spaceId 时落到用户的"个人"空间；
        带 parentId 时忽略 spaceId 与 projectId，继承父任务的空间与项目；
        省略 notes / status / priority 时分别为空串 / inbox / none。
        用户身份永远来自会话，不接受请求体传入。
        不能直接建 completed 的任务：status 传 done 会被拒绝，完成请走 complete 接口。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/today:
    get:
      operationId: listToday
      summary: 今天分组
      description: |
        按客户端传入的日期计算六个分组，一个任务只进优先级最高的那一组：
        逾期 → 今天到期 → 今天计划 → 进行中 → 下一步 → 今日完成。
        服务端不用自己的时区推导"今天"。归档项目下的任务不进任何分组。
      parameters:
        - name: date
          in: query
          required: true
          description: 客户端本地日期，YYYY-MM-DD
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 六个分组，固定返回，即使为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: daily_session
      description: 网页端使用；HttpOnly Cookie
    bearerAuth:
      type: http
      scheme: bearer
      description: '桌面端与脚本客户端使用；登录时带 X-Client: desktop 换取'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        建议所有写请求都带。键长 16–128 字符，按用户隔离、保留 24 小时。
        同一用户同一 key 同一请求体：返回首次响应；同一 key 不同请求体：返回 409。
      schema:
        type: string
        minLength: 16
        maxLength: 128

  responses:
    ValidationFailed:
      description: 字段缺失、格式错误或长度越界
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未登录、会话过期或令牌无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 版本冲突、幂等键复用或唯一约束冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: 未预期错误，细节只出现在日志里
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    EchoReq:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 200

    Echo:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: 原样返回，调用方据此确认内容没被改写

    EchoEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Echo'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateTaskReq:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 20000
        spaceId:
          type: string
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/CreateTaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        scheduledDate:
          type: [string, 'null']
          format: date
        dueDate:
          type: [string, 'null']
          format: date
        estimateMinutes:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
        tagIds:
          type: array
          x-go-type-skip-optional-pointer: true
          items:
            type: string
            format: uuid

    Task:
      type: object
      additionalProperties: false
      required:
        - id
        - spaceId
        - title
        - notes
        - status
        - priority
        - actualMinutes
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        projectId:
          type: [string, 'null']
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        title:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 20000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        scheduledDate:
          type: [string, 'null']
          format: date
        dueDate:
          type: [string, 'null']
          format: date
        estimateMinutes:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
        actualMinutes:
          type: integer
          minimum: 0
        completedAt:
          type: [string, 'null']
          format: date-time
        tagIds:
          type: array
          x-go-type-skip-optional-pointer: true
          items:
            type: string
            format: uuid
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskStatus:
      type: string
      description: 任务没有 archived 状态
      enum: [inbox, next, doing, waiting, blocked, done]

    CreateTaskStatus:
      type: string
      description: |
        创建时允许的状态，比 TaskStatus 少一个 done。
        创建即完成会让 completedAt 没有来源，完成必须走 POST /tasks/{id}/complete。
        传 done 返回 400 VALIDATION_FAILED。
      enum: [inbox, next, doing, waiting, blocked]

    TaskPriority:
      type: string
      description: 只影响排序与视觉，不参与今天分组
      enum: [none, low, medium, high, urgent]

    TodayGroup:
      type: object
      additionalProperties: false
      required: [count, estimateMinutes, tasks]
      properties:
        count:
          type: integer
          description: 以服务端为准；tasks 将来可能被截断，别拿 tasks.length 代替
        estimateMinutes:
          type: integer
          description: 只累加 estimateMinutes 非空的任务；同样以服务端为准
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    TodayGroups:
      type: object
      additionalProperties: false
      description: 固定六个键，空组也要返回
      required: [overdue, dueToday, planned, doing, next, completed]
      properties:
        overdue:
          $ref: '#/components/schemas/TodayGroup'
        dueToday:
          $ref: '#/components/schemas/TodayGroup'
        planned:
          $ref: '#/components/schemas/TodayGroup'
        doing:
          $ref: '#/components/schemas/TodayGroup'
        next:
          $ref: '#/components/schemas/TodayGroup'
        completed:
          $ref: '#/components/schemas/TodayGroup'

    Today:
      type: object
      additionalProperties: false
      required: [date, groups]
      properties:
        date:
          type: string
          format: date
        groups:
          $ref: '#/components/schemas/TodayGroups'

    Meta:
      type: object
      additionalProperties: false
      description: 每次响应都带。requestId 与响应头 X-Request-Id 是同一个值。
      required: [requestId]
      properties:
        requestId:
          type: string
          description: gateway 生成的 UUIDv7，用于串联日志

    TaskEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Task'
        meta:
          $ref: '#/components/schemas/Meta'

    TodayEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Today'
        meta:
          $ref: '#/components/schemas/Meta'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 面向用户，可直接展示
        details:
          type: object
          additionalProperties: true
          description: 结构化补充，如 currentVersion、taskId

    ErrorCode:
      type: string
      description: 面向程序，稳定不变；HTTP 状态码表达大类，错误码表达具体原因
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - ALREADY_EXISTS
        - RATE_LIMITED
        - INTERNAL
        - DEPENDENCY_UNAVAILABLE

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/Meta'
