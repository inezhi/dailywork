services:
  dailywork:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        ALL_PROXY: "${ALL_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: dailywork:0.2.0
    container_name: dailywork
    restart: unless-stopped
    ports:
      - "47821:47821"
    environment:
      DAILYWORK_SERVER_MODE: "1"
      DAILYWORK_DATA_DIR: /data
      DAILYWORK_OPEN_REGISTRATION: "${DAILYWORK_OPEN_REGISTRATION:-0}"
      DAILYWORK_SECURE_COOKIES: "${DAILYWORK_SECURE_COOKIES:-0}"
      DAILYWORK_TRUST_PROXY: "${DAILYWORK_TRUST_PROXY:-0}"
    volumes:
      - dailywork-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:47821/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dailywork-data:
