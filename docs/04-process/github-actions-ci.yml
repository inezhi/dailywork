# 归档的 GitHub Actions 工作流。
# 当前 OAuth 凭据缺少 workflow scope；执行 `gh auth refresh -s workflow` 后，
# 将此文件移回 .github/workflows/ci.yml 即可启用。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
