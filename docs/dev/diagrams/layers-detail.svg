<svg xmlns="http://www.w3.org/2000/svg" width="1790" height="1120" viewBox="0 0 1790 1120"
     font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="3" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#C2410C"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#15803D"/>
    </marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="3" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#BE185D"/>
    </marker>
  </defs>
  <rect width="1600" height="1120" fill="#ffffff"/>

  <text x="60" y="52" font-size="26" font-weight="700" fill="#111111">三层代码：每个结构、函数、方法各占一个方框</text>
  <text x="60" y="82" font-size="15" fill="#64748B">箭头只连相邻的框；向下的大箭头 = 跨层依赖</text>

  <!-- ================= adapters ================= -->
  <rect x="40" y="105" width="1520" height="235" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="64" y="140" font-size="19" font-weight="700" fill="#9A3412">adapters</text>
  <text x="180" y="140" font-size="14" fill="#C2410C">和外界打交道，不写业务规则</text>

  <rect x="64" y="165" width="190" height="145" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="80" y="191" font-size="15" font-weight="700" fill="#9A3412">taskRow</text>
  <text x="80" y="215" font-size="12" fill="#334155" font-family="Menlo, monospace">ID / UserID / SpaceID</text>
  <text x="80" y="237" font-size="12" fill="#334155" font-family="Menlo, monospace">Title / Status / Version</text>
  <text x="80" y="259" font-size="12" fill="#334155" font-family="Menlo, monospace">CompletedAt / DeletedAt</text>
  <text x="80" y="290" font-size="11" fill="#64748B">对应 tasks 表的一行</text>

  <rect x="274" y="165" width="180" height="145" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="290" y="191" font-size="15" font-weight="700" fill="#9A3412">TaskRepo</text>
  <text x="290" y="217" font-size="12" fill="#334155" font-family="Menlo, monospace">db *gorm.DB</text>
  <text x="290" y="247" font-size="11" fill="#64748B">Save / FindByID</text>
  <text x="290" y="267" font-size="11" fill="#64748B">是它的两个方法</text>
  <text x="290" y="291" font-size="11" fill="#64748B">实现 application 的接口</text>

  <rect x="474" y="165" width="160" height="145" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="490" y="191" font-size="15" font-weight="700" fill="#14532D">Open / New</text>
  <text x="490" y="217" font-size="12" fill="#14532D" font-family="Menlo, monospace">Open(dsn)</text>
  <text x="490" y="239" font-size="12" fill="#14532D" font-family="Menlo, monospace">New(db)</text>
  <text x="490" y="271" font-size="11" fill="#64748B">连库、造仓库</text>

  <rect x="654" y="165" width="180" height="145" rx="10" fill="#FDF2F8" stroke="#BE185D" stroke-width="2"/>
  <text x="670" y="191" font-size="15" font-weight="700" fill="#831843">Save</text>
  <text x="670" y="217" font-size="12" fill="#831843" font-family="Menlo, monospace">(ctx, *Task) error</text>
  <text x="670" y="247" font-size="12" fill="#334155">UPDATE where id+version</text>
  <text x="670" y="269" font-size="12" fill="#334155">→ 冲突 / INSERT</text>

  <rect x="854" y="165" width="150" height="145" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="870" y="191" font-size="15" font-weight="700" fill="#14532D">toRow</text>
  <text x="870" y="217" font-size="12" fill="#14532D" font-family="Menlo, monospace">(*Task)</text>
  <text x="870" y="239" font-size="12" fill="#14532D" font-family="Menlo, monospace">*taskRow</text>
  <text x="870" y="271" font-size="11" fill="#64748B">领域 → 行</text>

  <rect x="1024" y="165" width="180" height="145" rx="10" fill="#FDF2F8" stroke="#BE185D" stroke-width="2"/>
  <text x="1040" y="191" font-size="15" font-weight="700" fill="#831843">FindByID</text>
  <text x="1040" y="217" font-size="12" fill="#831843" font-family="Menlo, monospace">(ctx, id)</text>
  <text x="1040" y="247" font-size="12" fill="#334155">过滤 deleted_at</text>
  <text x="1040" y="269" font-size="12" fill="#334155">查不到 → ErrTaskNotFound</text>

  <rect x="1224" y="165" width="200" height="145" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="1240" y="191" font-size="15" font-weight="700" fill="#14532D">toDomain</text>
  <text x="1240" y="217" font-size="12" fill="#14532D" font-family="Menlo, monospace">(*taskRow) *Task</text>
  <text x="1240" y="249" font-size="11" fill="#64748B">行 → 领域对象</text>
  <text x="1240" y="271" font-size="11" fill="#64748B">走 Reconstitute</text>

  <!-- adapters 内部箭头（只连相邻框） -->
  <line x1="474" y1="230" x2="458" y2="230" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="834" y1="230" x2="850" y2="230" stroke="#15803D" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="1204" y1="230" x2="1220" y2="230" stroke="#15803D" stroke-width="1.8" marker-end="url(#ag)"/>

  <!-- adapters -> application -->
  <polyline points="364,310 364,372 184,372 184,446" fill="none" stroke="#C2410C" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="206" y="364" font-size="13" fill="#C2410C">实现 TaskRepository 接口</text>

  <!-- ================= application ================= -->
  <rect x="40" y="390" width="1520" height="230" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="64" y="425" font-size="19" font-weight="700" fill="#1E3A8A">application</text>
  <text x="196" y="425" font-size="14" fill="#2563EB">编排顺序，只定义接口不碰数据库</text>

  <rect x="64" y="450" width="240" height="140" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="80" y="476" font-size="15" font-weight="700" fill="#4C1D95">TaskRepository</text>
  <text x="80" y="500" font-size="12" fill="#4C1D95" font-family="Menlo, monospace">[接口]</text>
  <text x="80" y="526" font-size="12" fill="#4C1D95" font-family="Menlo, monospace">Save(ctx, t) error</text>
  <text x="80" y="548" font-size="12" fill="#4C1D95" font-family="Menlo, monospace">FindByID(ctx, id)</text>

  <rect x="324" y="450" width="150" height="140" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="340" y="476" font-size="15" font-weight="700" fill="#4C1D95">IDGenerator</text>
  <text x="340" y="502" font-size="12" fill="#4C1D95" font-family="Menlo, monospace">NewID() string</text>

  <rect x="494" y="450" width="130" height="140" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="510" y="476" font-size="15" font-weight="700" fill="#4C1D95">Clock</text>
  <text x="510" y="502" font-size="12" fill="#4C1D95" font-family="Menlo, monospace">Now() time</text>

  <rect x="644" y="450" width="250" height="140" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="660" y="476" font-size="15" font-weight="700" fill="#9A3412">CreateTaskInput</text>
  <text x="660" y="500" font-size="12" fill="#334155" font-family="Menlo, monospace">UserID / SpaceID / Title</text>
  <text x="660" y="522" font-size="12" fill="#334155" font-family="Menlo, monospace">Status / Priority / Dates</text>
  <text x="660" y="544" font-size="12" fill="#334155" font-family="Menlo, monospace">EstimateMinutes</text>
  <text x="660" y="572" font-size="11" fill="#64748B">协议层入参</text>

  <rect x="914" y="450" width="180" height="140" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="930" y="476" font-size="15" font-weight="700" fill="#14532D">NewCreateTask</text>
  <text x="930" y="502" font-size="12" fill="#14532D" font-family="Menlo, monospace">(repo, ids, clock)</text>
  <text x="930" y="524" font-size="12" fill="#14532D" font-family="Menlo, monospace">*CreateTask</text>

  <rect x="1114" y="450" width="200" height="140" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="1130" y="476" font-size="15" font-weight="700" fill="#9A3412">CreateTask</text>
  <text x="1130" y="502" font-size="12" fill="#334155" font-family="Menlo, monospace">repo  TaskRepository</text>
  <text x="1130" y="524" font-size="12" fill="#334155" font-family="Menlo, monospace">ids   IDGenerator</text>
  <text x="1130" y="546" font-size="12" fill="#334155" font-family="Menlo, monospace">clock Clock</text>

  <rect x="1334" y="450" width="206" height="140" rx="10" fill="#FDF2F8" stroke="#BE185D" stroke-width="2"/>
  <text x="1350" y="476" font-size="15" font-weight="700" fill="#831843">Execute</text>
  <text x="1350" y="502" font-size="12" fill="#831843" font-family="Menlo, monospace">(ctx, in) (*Task, error)</text>
  <text x="1350" y="528" font-size="12" fill="#334155">① 查父任务</text>
  <text x="1350" y="550" font-size="12" fill="#334155">② NewTask ③ Save</text>

  <!-- application 内部箭头 -->
  <line x1="1094" y1="520" x2="1110" y2="520" stroke="#475569" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="1314" y1="520" x2="1330" y2="520" stroke="#BE185D" stroke-width="1.8" marker-end="url(#ap)"/>

  <!-- application -> domain -->
  <polyline points="1437,590 1437,648 694,648 694,726" fill="none" stroke="#C2410C" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="742" y="640" font-size="13" fill="#C2410C">调用 NewTask</text>

  <!-- ================= domain ================= -->
  <rect x="40" y="670" width="1520" height="300" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="64" y="705" font-size="19" font-weight="700" fill="#14532D">domain</text>
  <text x="150" y="705" font-size="14" fill="#15803D">业务规则与不变量，不认识数据库 / HTTP / RPC</text>

  <rect x="64" y="730" width="220" height="140" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>
  <text x="80" y="756" font-size="15" font-weight="700" fill="#713F12">Title  [值对象]</text>
  <text x="80" y="782" font-size="12" fill="#713F12" font-family="Menlo, monospace">type Title string</text>
  <text x="80" y="808" font-size="12" fill="#713F12" font-family="Menlo, monospace">NewTitle(s) (Title, error)</text>
  <text x="80" y="834" font-size="11" fill="#92400E">非空、≤200 字符</text>

  <rect x="304" y="730" width="130" height="140" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>
  <text x="320" y="756" font-size="15" font-weight="700" fill="#713F12">Status</text>
  <text x="320" y="782" font-size="12" fill="#713F12" font-family="Menlo, monospace">1–6</text>

  <rect x="454" y="730" width="130" height="140" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2"/>
  <text x="470" y="756" font-size="15" font-weight="700" fill="#713F12">Priority</text>
  <text x="470" y="782" font-size="12" fill="#713F12" font-family="Menlo, monospace">1–5</text>

  <rect x="604" y="730" width="180" height="140" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="620" y="756" font-size="15" font-weight="700" fill="#14532D">NewTask</text>
  <text x="620" y="782" font-size="12" fill="#14532D" font-family="Menlo, monospace">(NewTaskParams)</text>
  <text x="620" y="804" font-size="12" fill="#14532D" font-family="Menlo, monospace">(*Task, error)</text>
  <text x="620" y="834" font-size="11" fill="#64748B">创建时校验</text>

  <rect x="1164" y="730" width="180" height="140" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="2"/>
  <text x="1180" y="756" font-size="15" font-weight="700" fill="#14532D">Reconstitute</text>
  <text x="1180" y="782" font-size="12" fill="#14532D" font-family="Menlo, monospace">(...) *Task</text>
  <text x="1180" y="812" font-size="11" fill="#64748B">从数据库重建</text>
  <text x="1180" y="834" font-size="11" fill="#64748B">不重放校验</text>

  <rect x="824" y="720" width="300" height="200" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="840" y="746" font-size="15" font-weight="700" fill="#1E3A8A">Task  [聚合根]</text>
  <text x="840" y="774" font-size="12" fill="#334155" font-family="Menlo, monospace">id / userID / spaceID</text>
  <text x="840" y="796" font-size="12" fill="#334155" font-family="Menlo, monospace">title Title · status Status</text>
  <text x="840" y="818" font-size="12" fill="#334155" font-family="Menlo, monospace">priority Priority · version</text>
  <text x="840" y="852" font-size="11" fill="#64748B">字段不导出</text>
  <text x="840" y="874" font-size="11" fill="#64748B">不变量只能通过方法改</text>

  <rect x="1384" y="730" width="150" height="90" rx="10" fill="#FDF2F8" stroke="#BE185D" stroke-width="2"/>
  <text x="1400" y="756" font-size="14" font-weight="700" fill="#831843">Complete</text>
  <text x="1400" y="780" font-size="11" fill="#831843" font-family="Menlo, monospace">(now) error</text>
  <text x="1400" y="802" font-size="11" fill="#64748B">Task 的方法</text>

  <rect x="1384" y="830" width="150" height="90" rx="10" fill="#FDF2F8" stroke="#BE185D" stroke-width="2"/>
  <text x="1400" y="856" font-size="14" font-weight="700" fill="#831843">Reopen</text>
  <text x="1400" y="880" font-size="11" fill="#831843" font-family="Menlo, monospace">(to, now) error</text>
  <text x="1400" y="902" font-size="11" fill="#64748B">Task 的方法</text>

  <!-- domain 内部箭头 -->
  <line x1="784" y1="800" x2="820" y2="800" stroke="#15803D" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="1164" y1="860" x2="1128" y2="860" stroke="#15803D" stroke-width="1.8" marker-end="url(#ag)"/>

  <!-- 图例 -->
  <g font-size="13" fill="#334155">
    <rect x="64" y="1010" width="16" height="16" rx="3" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="88" y="1023">值对象</text>
    <rect x="176" y="1010" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="200" y="1023">结构体 / 聚合</text>
    <rect x="320" y="1010" width="16" height="16" rx="3" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="344" y="1023">接口</text>
    <rect x="400" y="1010" width="16" height="16" rx="3" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
    <text x="424" y="1023">函数</text>
    <rect x="484" y="1010" width="16" height="16" rx="3" fill="#FDF2F8" stroke="#BE185D" stroke-width="1.5"/>
    <text x="508" y="1023">方法</text>
    <text x="600" y="1023" fill="#64748B">虚线 = 属于 / 逻辑归属</text>
  </g>

  <!-- ===== 层与层的关系（右侧轨道） ===== -->
  <text x="1590" y="140" font-size="16" font-weight="700" fill="#0F172A">层间关系</text>

  <!-- ① adapters 实现 application 的接口 -->
  <polyline points="1560,245 1600,245 1600,505 1566,505" fill="none" stroke="#C2410C" stroke-width="2.2" marker-end="url(#ao)"/>
  
  <!-- ② application 调用 domain -->
  <polyline points="1560,545 1625,545 1625,820 1566,820" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ab)"/>
  
  
  <rect x="1586" y="880" width="192" height="130" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1600" y="906" font-size="13" font-weight="700" fill="#0F172A">层间依赖</text>
  <line x1="1600" y1="926" x2="1630" y2="926" stroke="#C2410C" stroke-width="2.2"/>
  <text x="1638" y="930" font-size="12" fill="#334155">实现接口</text>
  <line x1="1600" y1="952" x2="1630" y2="952" stroke="#2563EB" stroke-width="2.2"/>
  <text x="1638" y="956" font-size="12" fill="#334155">调用领域</text>
  <line x1="1600" y1="978" x2="1630" y2="978" stroke="#15803D" stroke-width="2.2"/>
  <text x="1638" y="982" font-size="12" fill="#334155">读写 / 重建 Task</text>

  <!-- adapters 的具体块 → domain 的具体块 -->
  <polyline points="744,310 744,372 900,372 900,720" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#ag)"/>
  <polyline points="1104,310 1104,720" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#ag)"/>
  <polyline points="1324,310 1324,726" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#ag)"/>
</svg>
