<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#616E7C"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#FFFFFF"/>

  <rect x="310" y="20" width="240" height="44" rx="22" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
  <text x="430" y="48" text-anchor="middle" font-size="13.5" fill="#1F2933">PUT /tasks/{id}/complete</text>
  <line x1="430" y1="66" x2="430" y2="94" stroke="#616E7C" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="200" y="98" width="460" height="168" rx="12" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="2"/>
  <text x="220" y="126" font-size="15" font-weight="600" fill="#2B6CB0">应用服务 · CompleteTask</text>
  <text x="220" y="162" font-size="13" fill="#1F2933">① 取出聚合　taskRepo.Find(id)</text>
  <text x="220" y="198" font-size="13" fill="#1F2933">② task.Complete()</text>
  <text x="220" y="234" font-size="13" fill="#1F2933">③ 保存 + 写 outbox（同一事务）</text>

  <rect x="430" y="180" width="150" height="26" rx="6" fill="#FFF4E5" stroke="#C05621" stroke-width="1.2"/>
  <text x="505" y="198" text-anchor="middle" font-size="11.5" fill="#C05621">规则在聚合里</text>

  <line x1="300" y1="266" x2="300" y2="306" stroke="#616E7C" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="540" y1="266" x2="540" y2="306" stroke="#616E7C" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="190" y="310" width="220" height="58" rx="8" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="1.5"/>
  <text x="300" y="334" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">TaskRepository</text>
  <text x="300" y="354" text-anchor="middle" font-size="11.5" fill="#616E7C">只按聚合根存取</text>

  <rect x="450" y="310" width="210" height="58" rx="8" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="1.5"/>
  <text x="555" y="334" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">outbox</text>
  <text x="555" y="354" text-anchor="middle" font-size="11.5" fill="#616E7C">与业务写入同一事务</text>

  <text x="430" y="394" text-anchor="middle" font-size="12" fill="#616E7C">应用服务只安排先后，不判断“能不能完成”。</text>
</svg>
