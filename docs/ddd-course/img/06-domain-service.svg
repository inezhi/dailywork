<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#616E7C"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#FFFFFF"/>

  <rect x="290" y="18" width="280" height="44" rx="22" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
  <text x="430" y="46" text-anchor="middle" font-size="13.5" fill="#1F2933">用例：从 A 转 100 元到 B</text>
  <line x1="430" y1="64" x2="430" y2="88" stroke="#616E7C" stroke-width="1.5" marker-end="url(#ar5)"/>

  <rect x="70" y="92" width="530" height="64" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.8"/>
  <text x="92" y="118" font-size="13.5" font-weight="600" fill="#1F2933">应用服务 TransferMoney(fromID, toID, amount)</text>
  <text x="92" y="140" font-size="12" fill="#616E7C">取两个账户 · 开事务 · 保存 · 写事件</text>

  <line x1="335" y1="158" x2="335" y2="182" stroke="#616E7C" stroke-width="1.5" marker-end="url(#ar5)"/>

  <rect x="70" y="186" width="530" height="64" rx="10" fill="#FFF4E5" stroke="#C05621" stroke-width="1.8"/>
  <text x="92" y="212" font-size="13.5" font-weight="600" fill="#1F2933">领域服务 TransferService.transfer(from, to, amount)</text>
  <text x="92" y="234" font-size="12" fill="#616E7C">判断：两边总额不变、余额够不够</text>

  <line x1="335" y1="252" x2="335" y2="276" stroke="#616E7C" stroke-width="1.5" marker-end="url(#ar5)"/>

  <rect x="70" y="280" width="530" height="64" rx="10" fill="#F5F7FA" stroke="#616E7C" stroke-width="1.8"/>
  <text x="92" y="306" font-size="13.5" font-weight="600" fill="#1F2933">实体 Account.Withdraw() / Deposit()</text>
  <text x="92" y="328" font-size="12" fill="#616E7C">守住：自己的余额不能为负</text>

  <text x="630" y="118" font-size="12" fill="#2B6CB0">决定先后</text>
  <text x="630" y="140" font-size="11.5" fill="#9AA5B1">知道事务，不知道规则</text>

  <text x="630" y="212" font-size="12" fill="#C05621">判断对错</text>
  <text x="630" y="234" font-size="11.5" fill="#9AA5B1">知道规则，不知道事务</text>

  <text x="630" y="306" font-size="12" fill="#616E7C">守住自己</text>
  <text x="630" y="328" font-size="11.5" fill="#9AA5B1">只用自己的数据</text>

  <text x="430" y="392" text-anchor="middle" font-size="12" fill="#616E7C">越往上越管流程，越往下越管规则；领域服务正好卡在中间那一格。</text>
</svg>
